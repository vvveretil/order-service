services:
  postgres:
    container_name: order_service_db
    image: postgres:15
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_ORDERS_DB_NAME}
      POSTGRES_USER: ${POSTGRES_ORDERS_DB_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ORDERS_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: order_service_app
    depends_on:
      - postgres
    environment:
      POSTGRES_ORDERS_DB_USER: ${POSTGRES_ORDERS_DB_USER}
      POSTGRES_ORDERS_DB_PASSWORD: ${POSTGRES_ORDERS_DB_PASSWORD}
      POSTGRES_ORDERS_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_ORDERS_DB_NAME}
      ORDERS_DIR: ${ORDERS_DIR}
    volumes:
      - orders-data:/app/orders_data
    ports:
      - "8080:8080"

volumes:
  pgdata:
  orders-data: