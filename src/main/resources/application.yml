spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5432/diploma_orders
    username: ${ORDER_USERNAME}
    password: ${ORDER_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update  # Use `create`, `validate`, `update`, or `none` depending on your needs
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080