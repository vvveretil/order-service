spring:
  application:
    name: order-service

  datasource:
    url: ${POSTGRES_ORDERS_DB_URL}
    username: ${POSTGRES_ORDERS_DB_USER}
    password: ${POSTGRES_ORDERS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080

orders:
  directory: ${ORDERS_DIR:/app/orders_data}