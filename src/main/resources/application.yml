spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5432/order_service_db
    username: ${ORDER_USERNAME}
    password: ${ORDER_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080